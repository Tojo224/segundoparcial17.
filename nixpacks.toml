[phases.setup]
nixPkgs = ['php83', 'php83Packages.composer', 'php83Packages.gd', 'nginx', 'nodejs_20']

[phases.build]
cmds = [
  'composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts --ignore-platform-req=php-64bit --ignore-platform-req=ext-gd'
]

[start]
cmd = 'php artisan migrate --force && php artisan db:seed --class=RolesSeeder --force && php artisan serve --host=0.0.0.0 --port=$PORT'